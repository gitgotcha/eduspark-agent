spring:
  application:
    name: eduspark-agent
  ai:
    model:
      chat: ${SPRING_AI_MODEL_CHAT:openai}
      audio:
        speech: ${SPRING_AI_MODEL_AUDIO_SPEECH:none}
        transcription: ${SPRING_AI_MODEL_AUDIO_TRANSCRIPTION:none}
      image: ${SPRING_AI_MODEL_IMAGE:none}
      embedding: ${SPRING_AI_MODEL_EMBEDDING:none}
      moderation: ${SPRING_AI_MODEL_MODERATION:none}
    openai:
      base-url: ${SPRING_AI_OPENAI_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode}
      api-key: ${DASHSCOPE_API_KEY:}
      chat:
        options:
          model: ${SPRING_AI_OPENAI_CHAT_MODEL:qwen-plus}
          temperature: 0.3
      embedding:
        options:
          model: ${SPRING_AI_OPENAI_EMBEDDING_MODEL:text-embedding-v4}
  datasource:
    url: ${SPRING_DATASOURCE_URL:}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      idle-timeout: 120000
      max-lifetime: 300000
      keepalive-time: 120000
      validation-timeout: 5000
      connection-timeout: 30000
      connection-test-query: SELECT 1
  flyway:
    enabled: true
server:
  port: ${SERVER_PORT:8080}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

agent:
  planner:
    mode: ${AGENT_PLANNER_MODE:spring-ai}
auth:
  jwt:
    secret: ${AUTH_JWT_SECRET:}
    ttl-seconds: ${AUTH_JWT_TTL_SECONDS:86400}
